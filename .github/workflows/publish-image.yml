name: Publish container image

on:
  push:
    branches: [main]

# Keyless push to the capturly project's Artifact Registry via Workload Identity
# Federation — no static registry credentials. The homelab pulls this image with
# the shared keyless AR token (ar-token-refresher), the same as every other app.
permissions:
  contents: read
  id-token: write

env:
  IMAGE: us-central1-docker.pkg.dev/capturly-app/capturly/live-capturly-app
  WIF_PROVIDER: projects/614897024362/locations/global/workloadIdentityPools/github-pool/providers/github-provider
  WIF_SA: github-actions@capturly-app.iam.gserviceaccount.com

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - id: auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.WIF_SA }}

      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1

      - run: gcloud auth configure-docker us-central1-docker.pkg.dev --quiet

      - uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0

      - uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
