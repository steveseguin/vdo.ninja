<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
	<title id="title">Two-source vertical livestream routing overview</title>
	<desc id="desc">Apple Vision Pro point-of-view video and an iPhone front camera travel to OBS, where they are combined with artwork into one portrait program and sent to TikTok. Social Stream Ninja can return private chat to the phone.</desc>
	<defs>
		<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
			<stop offset="0" stop-color="#0b1020"/>
			<stop offset="1" stop-color="#17132b"/>
		</linearGradient>
		<linearGradient id="obs" x1="0" y1="0" x2="0" y2="1">
			<stop offset="0" stop-color="#222b46"/>
			<stop offset="1" stop-color="#171d31"/>
		</linearGradient>
		<filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
			<feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000" flood-opacity="0.28"/>
		</filter>
		<marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
			<path d="M0,0 L12,6 L0,12 z" fill="#79ddff"/>
		</marker>
		<style>
			.title { font: 700 42px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #f8f9ff; }
			.subtitle { font: 400 21px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #b7bfd8; }
			.eyebrow { font: 700 16px system-ui, -apple-system, "Segoe UI", sans-serif; letter-spacing: 2px; fill: #8ee5ff; }
			.card-title { font: 700 25px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #fff; }
			.body { font: 400 18px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #cbd1e4; }
			.small { font: 500 15px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #aeb7d1; }
			.badge { font: 700 14px system-ui, -apple-system, "Segoe UI", sans-serif; letter-spacing: 1px; fill: #0b1020; }
			.route { fill: none; stroke: #79ddff; stroke-width: 5; marker-end: url(#arrow); }
			.chat-route { fill: none; stroke: #c49cff; stroke-width: 4; stroke-dasharray: 10 10; marker-end: url(#arrow); }
		</style>
	</defs>

	<rect width="1600" height="900" rx="34" fill="url(#bg)"/>
	<circle cx="1390" cy="70" r="250" fill="#7047ff" opacity="0.08"/>
	<circle cx="175" cy="800" r="230" fill="#18c7e8" opacity="0.06"/>

	<text x="80" y="82" class="title">Two-source vertical live workflow</text>
	<text x="80" y="119" class="subtitle">VDO.Ninja transports feeds • OBS composes the portrait scene • TikTok receives one finished program</text>

	<text x="80" y="178" class="eyebrow">CAPTURE</text>
	<text x="515" y="178" class="eyebrow">TRANSPORT</text>
	<text x="995" y="178" class="eyebrow">PRODUCTION</text>

	<g filter="url(#shadow)">
		<rect x="80" y="210" width="340" height="190" rx="24" fill="#18213a" stroke="#576582" stroke-width="2"/>
		<rect x="106" y="234" width="90" height="60" rx="28" fill="#e9ecf4"/>
		<rect x="115" y="242" width="72" height="44" rx="21" fill="#1a2130"/>
		<text x="106" y="331" class="card-title">Vision Pro POV</text>
		<text x="106" y="365" class="body">The mirrored wearer view</text>

		<rect x="80" y="470" width="340" height="190" rx="24" fill="#18213a" stroke="#576582" stroke-width="2"/>
		<rect x="116" y="494" width="54" height="86" rx="11" fill="#dfe5f2"/>
		<circle cx="143" cy="504" r="4" fill="#273047"/>
		<rect x="124" y="515" width="38" height="52" rx="7" fill="#25314c"/>
		<text x="106" y="613" class="card-title">iPhone front camera</text>
		<text x="106" y="642" class="body">A separate face-camera feed</text>
	</g>

	<g filter="url(#shadow)">
		<rect x="515" y="210" width="365" height="270" rx="24" fill="#16253a" stroke="#4b8aa2" stroke-width="2"/>
		<rect x="541" y="234" width="112" height="29" rx="14" fill="#79ddff"/>
		<text x="559" y="254" class="badge">CHOOSE ONE</text>
		<text x="541" y="304" class="card-title">Vision Pro route</text>
		<text x="541" y="341" class="body">1. VDO.Ninja Screen on headset</text>
		<text x="541" y="374" class="body">2. AirPlay to Mac, capture in OBS</text>
		<text x="541" y="407" class="body">3. Tested receiver or Apple bridge</text>
		<text x="541" y="448" class="small">Windows is not a native Apple-listed receiver.</text>

		<rect x="515" y="510" width="365" height="150" rx="24" fill="#16253a" stroke="#4b8aa2" stroke-width="2"/>
		<text x="541" y="559" class="card-title">VDO.Ninja camera link</text>
		<text x="541" y="598" class="body">Stable Stream ID → OBS Browser Source</text>
		<text x="541" y="630" class="small">Use one source as the audio master.</text>
	</g>

	<path d="M420 305 C465 305 475 320 505 320" class="route"/>
	<path d="M420 565 C465 565 475 580 505 580" class="route"/>

	<g filter="url(#shadow)">
		<rect x="995" y="210" width="335" height="450" rx="24" fill="url(#obs)" stroke="#7a88ad" stroke-width="2"/>
		<text x="1023" y="256" class="card-title">OBS portrait scene</text>
		<text x="1023" y="287" class="small">1080 × 1920 • 30 fps starting point</text>

		<rect x="1082" y="315" width="160" height="284" rx="15" fill="#090c14" stroke="#d3a5ff" stroke-width="3"/>
		<rect x="1095" y="332" width="134" height="69" rx="7" fill="#354566"/>
		<circle cx="1162" cy="364" r="20" fill="#c8d1e5"/>
		<rect x="1095" y="417" width="134" height="128" rx="7" fill="#263c55"/>
		<path d="M1106 520 L1140 475 L1163 495 L1185 457 L1218 520 Z" fill="#67b3c8"/>
		<rect x="1095" y="559" width="134" height="22" rx="6" fill="#5f3a76"/>
		<text x="1023" y="621" class="small">Artwork • face camera • POV</text>
		<text x="1023" y="644" class="small">One audio master in OBS</text>
	</g>

	<path d="M880 345 C930 345 940 360 985 360" class="route"/>
	<path d="M880 585 C930 585 940 520 985 520" class="route"/>

	<g filter="url(#shadow)">
		<rect x="1390" y="335" width="150" height="190" rx="24" fill="#23182e" stroke="#d3a5ff" stroke-width="2"/>
		<rect x="1431" y="368" width="68" height="108" rx="14" fill="#080a10" stroke="#ff779c" stroke-width="3"/>
		<circle cx="1465" cy="489" r="4" fill="#aeb7d1"/>
		<text x="1414" y="560" class="card-title">TikTok</text>
		<text x="1405" y="591" class="small">LIVE access plus</text>
		<text x="1407" y="613" class="small">stream URL/key</text>
	</g>
	<path d="M1330 435 C1350 435 1360 435 1380 435" class="route"/>

	<g filter="url(#shadow)">
		<rect x="515" y="725" width="825" height="105" rx="22" fill="#211a36" stroke="#8e6cbd" stroke-width="2"/>
		<text x="545" y="768" class="card-title">Optional private chat monitor</text>
		<text x="545" y="798" class="body">Social Stream Ninja session → VDO.Ninja mobile app</text>
		<text x="545" y="822" class="small">Keep it out of the program unless you intentionally add a chat overlay.</text>
	</g>
	<path d="M1390 620 C1380 685 1340 745 1340 775" class="chat-route"/>
	<path d="M515 778 C430 778 360 685 300 670" class="chat-route"/>
</svg>
