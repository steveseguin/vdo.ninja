<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
	<title id="title">Stable guest IDs mapped to production inputs</title>
	<desc id="desc">Three guest invite links use unique push IDs and bare view parameters. Each ID maps to a matching production browser input using view.</desc>
	<defs>
		<linearGradient id="bg3" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0b1225"/><stop offset="1" stop-color="#121c36"/></linearGradient>
		<linearGradient id="line3" gradientUnits="userSpaceOnUse" x1="366" y1="0" x2="822" y2="0"><stop stop-color="#22d3ee"/><stop offset="1" stop-color="#8b5cf6"/></linearGradient>
		<marker id="a3" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#8b5cf6"/></marker>
		<filter id="s3" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="7" stdDeviation="9" flood-color="#020617" flood-opacity=".35"/></filter>
	</defs>
	<rect width="1200" height="520" rx="26" fill="url(#bg3)"/>
	<text x="48" y="54" fill="#f8fafc" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="30" font-weight="700">One guest ID maps to one production input</text>
	<text x="48" y="81" fill="#94a3b8" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="16">Reuse the same Push/View pair after a refresh or reconnect.</text>

	<rect x="48" y="110" width="1104" height="64" rx="16" fill="#17233f" stroke="#334155"/>
	<text x="72" y="136" fill="#67e8f9" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="13" font-weight="700" letter-spacing="1">GUEST INVITE PATTERN</text>
	<text x="72" y="159" fill="#f8fafc" font-family="Consolas, Menlo, monospace" font-size="16">?room=EVENT&amp;push=GUEST_ID&amp;view</text>
	<text x="1128" y="150" text-anchor="end" fill="#94a3b8" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14">bare &amp;view = receive no remote streams</text>

	<g font-family="Inter, Segoe UI, Arial, sans-serif" filter="url(#s3)">
		<g transform="translate(48 206)">
			<rect width="318" height="62" rx="15" fill="#122a3c" stroke="#22d3ee"/>
			<circle cx="32" cy="31" r="16" fill="#22d3ee" fill-opacity=".18"/><text x="32" y="36" text-anchor="middle" fill="#67e8f9" font-size="14" font-weight="700">1</text>
			<text x="60" y="27" fill="#f8fafc" font-size="15" font-weight="700">Guest 01 invite</text>
			<text x="60" y="47" fill="#94a3b8" font-family="Consolas, Menlo, monospace" font-size="13">&amp;push=CamA7Q&amp;view</text>
		</g>
		<g transform="translate(48 286)">
			<rect width="318" height="62" rx="15" fill="#122a3c" stroke="#22d3ee"/>
			<circle cx="32" cy="31" r="16" fill="#22d3ee" fill-opacity=".18"/><text x="32" y="36" text-anchor="middle" fill="#67e8f9" font-size="14" font-weight="700">2</text>
			<text x="60" y="27" fill="#f8fafc" font-size="15" font-weight="700">Guest 02 invite</text>
			<text x="60" y="47" fill="#94a3b8" font-family="Consolas, Menlo, monospace" font-size="13">&amp;push=CamB4N&amp;view</text>
		</g>
		<g transform="translate(48 366)">
			<rect width="318" height="62" rx="15" fill="#122a3c" stroke="#22d3ee"/>
			<circle cx="32" cy="31" r="16" fill="#22d3ee" fill-opacity=".18"/><text x="32" y="36" text-anchor="middle" fill="#67e8f9" font-size="14" font-weight="700">3</text>
			<text x="60" y="27" fill="#f8fafc" font-size="15" font-weight="700">Guest 03 invite</text>
			<text x="60" y="47" fill="#94a3b8" font-family="Consolas, Menlo, monospace" font-size="13">&amp;push=CamC9K&amp;view</text>
		</g>
	</g>

	<g stroke="url(#line3)" stroke-width="3" fill="none" marker-end="url(#a3)">
		<path d="M366 237H822"/>
		<path d="M366 317H822"/>
		<path d="M366 397H822"/>
	</g>
	<rect x="476" y="282" width="236" height="70" rx="18" fill="#17233f" stroke="#475569"/>
	<text x="594" y="309" text-anchor="middle" fill="#c4b5fd" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="15" font-weight="700">VDO.Ninja media paths</text>
	<text x="594" y="333" text-anchor="middle" fill="#94a3b8" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="13">Only production requests these IDs</text>

	<g font-family="Inter, Segoe UI, Arial, sans-serif" filter="url(#s3)">
		<g transform="translate(834 206)">
			<rect width="318" height="62" rx="15" fill="#251f3d" stroke="#8b5cf6"/>
			<text x="24" y="27" fill="#f8fafc" font-size="15" font-weight="700">Production input 1</text>
			<text x="24" y="47" fill="#c4b5fd" font-family="Consolas, Menlo, monospace" font-size="13">&amp;view=CamA7Q&amp;solo</text>
		</g>
		<g transform="translate(834 286)">
			<rect width="318" height="62" rx="15" fill="#251f3d" stroke="#8b5cf6"/>
			<text x="24" y="27" fill="#f8fafc" font-size="15" font-weight="700">Production input 2</text>
			<text x="24" y="47" fill="#c4b5fd" font-family="Consolas, Menlo, monospace" font-size="13">&amp;view=CamB4N&amp;solo</text>
		</g>
		<g transform="translate(834 366)">
			<rect width="318" height="62" rx="15" fill="#251f3d" stroke="#8b5cf6"/>
			<text x="24" y="27" fill="#f8fafc" font-size="15" font-weight="700">Production input 3</text>
			<text x="24" y="47" fill="#c4b5fd" font-family="Consolas, Menlo, monospace" font-size="13">&amp;view=CamC9K&amp;solo</text>
		</g>
	</g>

	<rect x="48" y="458" width="1104" height="38" rx="11" fill="#f59e0b" fill-opacity=".1"/>
	<text x="600" y="482" text-anchor="middle" fill="#fcd34d" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14" font-weight="600">Never give two simultaneous publishers the same Push ID.</text>
</svg>
