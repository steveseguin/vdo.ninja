<svg xmlns="http://www.w3.org/2000/svg" width="960" height="470" viewBox="0 0 960 470" role="img" aria-labelledby="title description">
  <title id="title">How a VDO.Ninja tab reaches Icecast</title>
  <desc id="description">A VDO.Ninja tab using icecastpush or icecastview first tries a direct upload to the Icecast or AzuraCast source mount. If the direct upload fails or takes more than 5 seconds, it switches to the VDO.Ninja Icecast relay. Plain http servers opened from the HTTPS site always use the relay.</desc>
  <defs>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#205c96"/></marker>
    <marker id="arrowOrange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#b25d00"/></marker>
  </defs>
  <rect width="960" height="470" fill="white"/>
  <g font-family="Arial, Helvetica, sans-serif" text-anchor="middle" fill="#142c43">
    <text x="480" y="50" font-size="34" font-weight="bold">How a VDO.Ninja tab reaches Icecast</text>
    <g fill="#edf4fb" stroke="#205c96" stroke-width="3">
      <rect x="30" y="110" width="240" height="200" rx="22"/>
      <rect x="690" y="110" width="240" height="200" rx="22"/>
    </g>
    <rect x="365" y="232" width="230" height="96" rx="18" fill="#fdf3e7" stroke="#b25d00" stroke-width="3"/>
    <text x="150" y="190" font-size="26" font-weight="bold">VDO.Ninja tab</text>
    <text x="150" y="230" font-size="22">&amp;icecastpush</text>
    <text x="150" y="262" font-size="22">or &amp;icecastview</text>
    <text x="810" y="180" font-size="26" font-weight="bold">Icecast or</text>
    <text x="810" y="214" font-size="26" font-weight="bold">AzuraCast</text>
    <text x="810" y="256" font-size="22">source mount</text>
    <text x="480" y="273" font-size="24" font-weight="bold">Icecast relay</text>
    <text x="480" y="306" font-size="20">fallback</text>
    <text x="480" y="148" font-size="22">1. Direct upload</text>
    <g stroke-width="5" fill="none">
      <path d="M280 166 H680" stroke="#205c96" marker-end="url(#arrowBlue)"/>
      <path d="M280 268 L355 280" stroke="#b25d00" marker-end="url(#arrowOrange)"/>
      <path d="M605 280 L680 268" stroke="#b25d00" marker-end="url(#arrowOrange)"/>
    </g>
    <text x="480" y="390" font-size="22">2. If direct fails or takes over 5 seconds, the relay takes over.</text>
    <text x="480" y="428" font-size="22">Plain http:// servers on the HTTPS site always use the relay.</text>
  </g>
</svg>
