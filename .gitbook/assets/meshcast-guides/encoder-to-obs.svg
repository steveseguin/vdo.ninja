<svg xmlns="http://www.w3.org/2000/svg" width="600" height="340" viewBox="0 0 600 340" role="img" aria-labelledby="title desc">
  <title id="title">RTMP or SRT to OBS through Meshcast</title>
  <desc id="desc">A phone or encoder uploads to Meshcast. Copy the Meshcast VDO.Ninja View Link into an OBS Browser Source.</desc>
  <rect width="600" height="340" rx="18" fill="#f1f5f9"/>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <rect x="24" y="18" width="552" height="72" rx="12" fill="#fff" stroke="#cbd5e1"/>
    <text x="300" y="47" font-size="23" font-weight="700" fill="#0f172a">Phone or encoder</text>
    <text x="300" y="74" font-size="19" fill="#475569">Send RTMP or SRT</text>
    <path d="M300 96v22m-7-7 7 7 7-7" fill="none" stroke="#2563eb" stroke-width="3"/>
    <rect x="24" y="126" width="552" height="72" rx="12" fill="#dbeafe" stroke="#93c5fd"/>
    <text x="300" y="155" font-size="23" font-weight="700" fill="#0f172a">Meshcast</text>
    <text x="300" y="182" font-size="19" fill="#334155">Copy VDO.Ninja View Link</text>
    <path d="M300 204v22m-7-7 7 7 7-7" fill="none" stroke="#2563eb" stroke-width="3"/>
    <rect x="24" y="234" width="552" height="88" rx="12" fill="#fff" stroke="#cbd5e1"/>
    <text x="300" y="267" font-size="23" font-weight="700" fill="#0f172a">Receiving OBS</text>
    <text x="300" y="297" font-size="19" fill="#475569">Paste into a Browser Source</text>
  </g>
</svg>
