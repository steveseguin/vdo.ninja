<!DOCTYPE html>
<html lang="en">
<head>
	<meta name="description" content="Drop arbitrary URLs into a responsive iframe grid for multi-angle monitoring." />
	<link rel="canonical" href="https://vdo.ninja/examples/grid.html" />
	<meta property="og:type" content="website" />
	<meta property="og:site_name" content="VDO.Ninja" />
	<meta property="og:url" content="https://vdo.ninja/examples/grid.html" />
	<meta property="og:title" content="Grid Builder - VDO.Ninja" />
	<meta property="og:description" content="Drop arbitrary URLs into a responsive iframe grid for multi-angle monitoring." />
	<meta property="og:image" content="https://vdo.ninja/media/vdoNinja_logo_full.png" />
	<meta name="twitter:card" content="summary_large_image" />
	<meta name="twitter:title" content="Grid Builder - VDO.Ninja" />
	<meta name="twitter:description" content="Drop arbitrary URLs into a responsive iframe grid for multi-angle monitoring." />
	<meta name="twitter:image" content="https://vdo.ninja/media/vdoNinja_logo_full.png" />
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Grid Builder - VDO.Ninja</title>
<style>
  /* Grid layout for iframes */
  .iframe-container {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); /* Adjust based on desired width */
    gap: 10px; /* Spacing between iframes */
  }
  iframe {
    width: 100%;
    height: 200px; /* Adjust based on desired height */
    border: 1px solid #ccc;
  }
</style>
</head>
<body>

<h2>Add a URL as Iframe</h2>
<input type="text" id="urlInput" value="https://vdo.ninja/" placeholder="Enter URL here">
<button onclick="addIframe()">Add Iframe</button>

<div class="iframe-container" id="iframeContainer"></div>

<script>
  var trustedIframeAllow = "document-domain;encrypted-media;sync-xhr;usb;web-share;cross-origin-isolated;accelerometer;midi;geolocation;autoplay;camera;microphone;fullscreen;picture-in-picture;display-capture;gyroscope;";
  var genericIframeAllow = "autoplay;encrypted-media;fullscreen;picture-in-picture;";

  function normalizeIframeUrl(value) {
    var url = (value || "").trim();
    if (!url) {
      return false;
    }

    var firstSegment = url.split(/[\/?#]/)[0];
    var relativePage = /\.(?:html?|xhtml|shtml|php|asp|aspx|jsp)$/i.test(firstSegment);
    if (!/^[a-z][a-z0-9+.-]*:/i.test(url) && firstSegment.indexOf(".") > -1 && !relativePage && url.indexOf("./") !== 0 && url.indexOf("/") !== 0) {
      url = "https://" + url;
    }

    try {
      var parsed = new URL(url, window.location.href);
      var protocol = (parsed.protocol || "").toLowerCase();
      if (protocol !== "http:" && protocol !== "https:") {
        return false;
      }
      if (protocol === "http:" && parsed.hostname !== "localhost" && parsed.hostname !== "127.0.0.1" && parsed.hostname !== "[::1]" && location.hostname !== "insecure.vdo.ninja") {
        parsed.protocol = "https:";
      }
      return parsed.href;
    } catch (e) {
      return false;
    }
  }

  function isTrustedIframeUrl(url) {
    try {
      var hostname = new URL(url, window.location.href).hostname.toLowerCase();
      return hostname === location.hostname ||
        hostname === "localhost" ||
        hostname === "127.0.0.1" ||
        hostname === "[::1]" ||
        hostname === "vdo.ninja" ||
        hostname.endsWith(".vdo.ninja") ||
        hostname === "obs.ninja" ||
        hostname.endsWith(".obs.ninja") ||
        hostname === "versus.cam" ||
        hostname === "dev.versus.cam" ||
        hostname === "backup.vdo.ninja" ||
        hostname === "invite.cam" ||
        hostname === "rtc.ninja";
    } catch (e) {
      return false;
    }
  }

  function addIframe() {
    var url = normalizeIframeUrl(document.getElementById('urlInput').value);
    if (url) { // Check if the URL is not empty
      var iframe = document.createElement('iframe');
      iframe.src = url;
	  iframe.allow = isTrustedIframeUrl(url) ? trustedIframeAllow : genericIframeAllow;
      document.getElementById('iframeContainer').appendChild(iframe);
      //document.getElementById('urlInput').value = ''; // Clear input field
    } else {
      alert("Please enter a valid http or https URL.");
    }
  }
</script>

</body>
</html>
