server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    location = /healthz {
        access_log off;
        return 200 'ok';
    }

    # HTML and the PWA manifest must revalidate so deploys take effect promptly.
    location ~* \.(html|json|webmanifest)$ {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # Static assets are cache-busted upstream via ?ver= query strings.
    location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico|woff|woff2|mp3|wav)$ {
        add_header Cache-Control "public, max-age=3600";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ $uri.html =404;
    }
}
